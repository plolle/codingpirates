# Kurserne på sitet. dir er kursets mappe, og lessons er lektionerne i den
# rækkefølge de skal tages.
# ready: false gør punktet grået ud i menuen, indtil lektionen er skrevet.
- dir: gdevelop/platformspil
  title: GDevelop
  subtitle: Byg dit eget platformspil
  icon: 🎮
  lessons:
    - num: 1
      dir: 01-intro
      title: INTRO
      subtitle: Kom i gang og hent grafikken
